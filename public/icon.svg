<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Premium Dark Background with Depth -->
  <rect width="512" height="512" rx="100" fill="url(#main_bg)"/>
  <rect x="15" y="15" width="482" height="482" rx="85" stroke="white" stroke-opacity="0.05" stroke-width="4"/>

  <!-- Glowing Search Ring -->
  <g filter="url(#glow)">
    <circle cx="280" cy="232" r="100" stroke="url(#gold_grad)" stroke-width="20"/>
    <path d="M350 302L430 382" stroke="url(#gold_grad)" stroke-width="24" stroke-linecap="round"/>
  </g>

  <!-- Commit Graph Representation -->
  <g filter="url(#commit_glow)">
    <!-- Branch Lines -->
    <path d="M160 360V152M160 256C160 216 192 192 220 192" stroke="white" stroke-width="16" stroke-linecap="round" stroke-opacity="0.8"/>
    
    <!-- Nodes -->
    <circle cx="160" cy="152" r="22" fill="#38BDF8" stroke="white" stroke-width="6"/>
    <circle cx="160" cy="360" r="22" fill="#2563EB" stroke="white" stroke-width="6"/>
    <circle cx="160" cy="256" r="22" fill="white" stroke="#2563EB" stroke-width="6"/>
    <circle cx="260" cy="192" r="22" fill="#F472B6" stroke="white" stroke-width="6"/>
  </g>

  <!-- Definitions -->
  <defs>
    <linearGradient id="main_bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.5" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="gold_grad" x1="180" y1="132" x2="430" y2="382" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDE047"/>
      <stop offset="1" stop-color="#EAB308"/>
    </linearGradient>
    <filter id="glow" x="130" y="100" width="350" height="350" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="commit_glow" x="100" y="100" width="250" height="350" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#38BDF8" flood-opacity="0.3"/>
    </filter>
  </defs>
</svg>
